<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GENESIS LAB • CENTERED</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.3.1/dist/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#04080f;color:#eaf4f6;font-family:system-ui,monospace;overflow:hidden;height:100vh;height:100dvh}
.bg{position:fixed;inset:0;z-index:-1;background:#04080f url('./sci_fi_archive_lab.webp') center/cover no-repeat}
.bg::after{content:'';position:absolute;inset:0;background:rgba(4,8,15,.65)}
model-viewer#mv{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;z-index:1;display:flex;align-items:center;justify-content:center}
header{position:fixed;top:0;left:0;right:0;height:52px;padding:0 14px;display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.6);backdrop-filter:blur(12px);z-index:10;border-bottom:1px solid rgba(125,232,255,.15)}
.bottom-bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10;align-items:center}
.circle-btn{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.7);border:1px solid rgba(125,232,255,.4);color:#7de8ff;font-size:16px;cursor:pointer;backdrop-filter:blur(10px)}
.main-btn{padding:14px 28px;border-radius:999px;background:linear-gradient(90deg,#7de8ff,#3ac6ff);border:none;color:#000;font-weight:900;font-size:11px;letter-spacing:1.2px;cursor:pointer;box-shadow:0 0 20px rgba(125,232,255,.6);position:relative;overflow:hidden}
.main-btn::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:shine 2s infinite}
@keyframes shine{0%{left:-100%}100%{left:100%}}
.live-btn{padding:6px 12px;border-radius:999px;background:linear-gradient(90deg,#ff2a2a,#ff5a5a);border:1px solid #ff5a5a;color:#fff;font-size:8px;font-weight:900;box-shadow:0 0 12px rgba(255,42,42,.6);animation:pulse 1.5s infinite;cursor:pointer}
@keyframes pulse{0%,100%{box-shadow:0 0 10px rgba(255,42,42,.5)}50%{box-shadow:0 0 22px rgba(255,42,42,.9)}}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(4,8,15,.85);backdrop-filter:blur(18px);display:none;overflow-y:auto;padding:20px}
.overlay.show{display:block;animation:fadeIn.4s ease}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}
.panel{max-width:700px;margin:60px auto;background:rgba(10,20,35,.98);border:1px solid rgba(125,232,255,.25);border-radius:18px;overflow:hidden;box-shadow:0 0 40px rgba(125,232,255,.15)}
.panel-head{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(125,232,255,.15);background:rgba(0,0,0,.3)}
.close-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,42,42,.15);border:1px solid rgba(255,42,42,.4);color:#ff5a5a;cursor:pointer;font-size:16px}
.panel-body{padding:18px}
.block-label{font-size:7px;letter-spacing:1.5px;color:#7de8ff;font-weight:800;margin-bottom:4px}
.block-text{font-size:11.5px;line-height:1.6}
.info-block{padding:12px;border-radius:10px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.07);margin:8px 0;transition:.3s}
.info-block:hover{border-color:rgba(125,232,255,.35);box-shadow:0 0 15px rgba(125,232,255,.15);transform:translateX(3px)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<div class="bg"></div>

<!-- CENTERED MODEL - FIXED TARGET -->
<model-viewer id="mv"
src="./assests/butterfly.glb"
camera-controls auto-rotate
camera-orbit="0deg 75deg 105%"
camera-target="0m 0m 0m"
field-of-view="30deg"
min-camera-orbit="auto auto 80%"
max-camera-orbit="auto auto 180%"
exposure="1.2"
shadow-intensity="0.6"
auto-rotate-delay="0"
interaction-prompt="none"
autoplay></model-viewer>

<header>
<div style="display:flex;gap:10px;align-items:center"><div style="width:30px;height:30px;border-radius:8px;background:rgba(20,35,50,.9);border:1px solid rgba(125,232,255,.3);display:flex;align-items:center;justify-content:center">🦋</div><div style="font-weight:800;font-size:10px;letter-spacing:1px">GENESIS LAB</div><div id="counter" style="margin-left:8px;font-size:10px;border:1px solid rgba(125,232,255,.3);padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.4)">01/04</div></div>
<button class="live-btn" onclick="mv.autoRotate=!mv.autoRotate">● LIVE</button>
</header>

<div class="bottom-bar">
<button class="circle-btn" onclick="move(-1)">‹</button>
<button class="main-btn" onclick="openInfo()">◉ VIEW ALL INFORMATION</button>
<button class="circle-btn" onclick="move(1)">›</button>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this) closeInfo()">
<div class="panel">
<div class="panel-head"><div><div style="font-size:7px;color:#7de8ff;font-weight:800">SPECIMEN DATA</div><div id="pName" style="font-size:20px;font-weight:900;font-style:italic">BUTTERFLY</div></div><button class="close-btn" onclick="closeInfo()">✕</button></div>
<div class="panel-body">
<div id="pSci" style="font-size:11px;color:#e6ff54;font-style:italic;margin-bottom:12px"></div>
<div class="info-block"><div class="block-label">DESCRIPTION</div><div id="pDesc" class="block-text"></div></div>
<div class="grid2">
<div class="info-block"><div class="block-label">HABITAT</div><div id="pHabitat" class="block-text"></div></div>
<div class="info-block"><div class="block-label">DIET</div><div id="pDiet" class="block-text"></div></div>
<div class="info-block"><div class="block-label">LIFESPAN</div><div id="pLife" class="block-text"></div></div>
<div class="info-block"><div class="block-label">SIZE</div><div id="pWing" class="block-text"></div></div>
</div>
<div class="info-block" style="background:rgba(125,232,255,.07);border-color:rgba(125,232,255,.2)"><div class="block-label">BEHAVIOR</div><div id="pBehav" class="block-text"></div></div>
<div class="info-block" style="background:rgba(230,255,84,.07);border-color:rgba(230,255,84,.2)"><div class="block-label" style="color:#e6ff54">CONSERVATION</div><div id="pStatus" class="block-text"></div></div>
</div>
</div>
</div>

<script>
const models=['./assests/butterfly.glb','./assests/bee_converted.glb','./assests/a_rhino_beetle.glb','./assests/mantis_religiosa_-_ct_scan.glb'];
const data=[
{name:"BUTTERFLY",sci:"Danaus plexippus • Monarch",desc:"Longest insect migration - 4,800 km USA to Mexico. Microscopic scales create orange-black warning patterns for toxicity from milkweed.",habitat:"Tropical Meadows, Gardens, Milkweed Fields",diet:"Nectar, Pollen, Milkweed",lifespan:"2-6 Weeks / 9 Months Migratory",wingspan:"8.9 - 10.2 cm wingspan",behav:"Diurnal migrator. Uses sun compass. Overwinters in clusters of thousands. Can taste with feet!",status:"VULNERABLE - 80% decline since 1990s. Protected under ESA 2024."},
{name:"HONEY BEE",sci:"Apis mellifera • Honey Bee",desc:"Most important pollinator - 75% fruits & veg. Colony of 60k bees pollinates 300M flowers/day. 5 eyes, sees UV patterns.",habitat:"Managed Hives, Orchards, Gardens",diet:"Nectar & Pollen",lifespan:"6 Weeks Worker / 5 Years Queen",wingspan:"2.1 cm body, 4.5 cm wingspan",behav:"Waggle dance language - figure-8 tells food location. Hive at 35°C exact. Honey never spoils!",status:"STABLE Managed - Wild declining 30% yearly due to mites & pesticides."},
{name:"RHINO BEETLE",sci:"Oryctes rhinoceros • Rhino Beetle",desc:"Strongest animal - lifts 850x body weight = human lifting 65 tons! Armor-plated, crucial decomposer.",habitat:"Tropical Forests, Decaying Logs",diet:"Sap, Decaying Fruit",lifespan:"1-2 Years total",wingspan:"5-8 cm body + 2cm horn",behav:"Males horn wrestling like sumo. Larvae snoring sounds. Can fly 2km for mates.",status:"LEAST CONCERN - Beneficial decomposer, creates soil."},
{name:"MANTIS RELIGIOSA",sci:"Mantis religiosa • Praying Mantis",desc:"Ultimate ambush predator - 180° head rotation, stereoscopic vision, strike 50-70ms faster than blink.",habitat:"Shrublands, Gardens, Grasslands",diet:"Carnivore - Flies, Moths, Crickets",lifespan:"10-12 Months",wingspan:"5-7 cm body",behav:"Calculates distance before strike. Female cannibalizes male 13-28%. Belly ear hears bats!",status:"LEAST CONCERN - Excellent pest control. Protected in Germany."}
];
let cur=0; const mv=document.getElementById('mv');

function render(){
 const d=data[cur];
 mv.src=models[cur];
 // CENTER FIX: target always 0 0 0, orbit in % so it auto-centers
 mv.cameraTarget="0m 0m 0m";
 mv.cameraOrbit="0deg 75deg 105%";
 mv.fieldOfView="30deg";
 document.getElementById('counter').textContent=`00${cur+1}/04`;
 document.getElementById('pName').textContent=d.name;
 document.getElementById('pSci').textContent=d.sci;
 document.getElementById('pDesc').textContent=d.desc;
 document.getElementById('pHabitat').textContent=d.habitat;
 document.getElementById('pDiet').textContent=d.diet;
 document.getElementById('pLife').textContent=d.lifespan;
 document.getElementById('pWing').textContent=d.wingspan;
 document.getElementById('pBehav').textContent=d.behav;
 document.getElementById('pStatus').textContent=d.status;
}
window.move=function(dir){cur=(cur+dir+models.length)%models.length;render()}
window.openInfo=function(){document.getElementById('overlay').classList.add('show')}
window.closeInfo=function(){document.getElementById('overlay').classList.remove('show')}
let sx=0, onModel=false;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX; onModel=e.target.closest('model-viewer')!==null},{passive:true});
document.addEventListener('touchend',e=>{if(onModel) return; let dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>80) move(dx<0?1:-1)},{passive:true});
render();
</script>
</body>
</html>
