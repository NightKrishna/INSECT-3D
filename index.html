<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>GENESIS LAB / VOID VIPERS</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.3.1/dist/model-viewer.min.js"></script>
<style>
:root{--cyan:#7de8ff;--lime:#e6ff54;--text:#eaf4f6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#04080f;color:var(--text);font-family:system-ui,monospace;overflow:hidden;height:100dvh;width:100vw}
.bg{position:fixed;inset:0;z-index:0;background:url('./sci_fi_archive_lab.webp') center/cover no-repeat,#04080f;filter:brightness(.6)}
.bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,8,15,.1),rgba(4,8,15,.9))}
header{position:fixed;top:0;left:0;right:0;z-index:20;height:56px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.45);backdrop-filter:blur(18px);border-bottom:1px solid rgba(125,232,255,.14)}
.main{position:relative;z-index:2;padding-top:56px;height:100dvh;display:flex;justify-content:center;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.wrap{width:100%;max-width:1360px;display:grid;grid-template-columns:1.15fr.85fr;gap:16px;padding:16px;height:auto}
.model-shell{position:relative;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,rgba(20,35,50,.85),rgba(8,14,22,.95));border:1px solid rgba(125,232,255,.22);display:flex;flex-direction:column;min-height:520px}
.viewer-box{flex:1;display:flex;align-items:center;justify-content:center;padding:8px;position:relative}
model-viewer{width:100%!important;height:440px!important;--progress-bar-color:var(--cyan)}
@keyframes floatLab{0%,100%{transform:translateY(0) scale(.52)}50%{transform:translateY(-10px) scale(.54)}}
model-viewer{animation:floatLab 3.8s ease-in-out infinite}
.nav{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:12px;z-index:10;padding:0 12px}
.nav button{flex:1;max-width:160px;padding:14px 10px;border-radius:999px;background:rgba(0,0,0,.6);border:1px solid rgba(125,232,255,.35);color:var(--cyan);font-size:12px;font-weight:800;letter-spacing:1px;cursor:pointer;backdrop-filter:blur(12px);box-shadow:0 0 16px rgba(125,232,255,.15)}
.nav button:active{transform:scale(.96);background:var(--cyan);color:#000}
.info{border-radius:20px;background:linear-gradient(180deg,rgba(22,38,54,.92),rgba(10,18,26,.96));border:1px solid rgba(125,232,255,.18);padding:18px}
.info-name{font-size:32px;font-weight:900;font-style:italic;text-transform:uppercase;line-height:.9}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.08);font-size:12px}
.desc{margin:12px 0;font-size:12.5px;opacity:.7;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{padding:10px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.06)}

/* MOBILE CHROME PERFECT */
@media(max-width:900px){
  body{overflow:auto}
 .main{height:auto;min-height:100dvh;display:block;padding:56px 0 0}
 .wrap{grid-template-columns:1fr;gap:14px;padding:12px 12px 100px}
 .model-shell{min-height:68vh;height:68vh;border-radius:18px}
 .viewer-box{padding:0}
  model-viewer{height:58vh!important}
  @keyframes floatLab{0%,100%{transform:translateY(0) scale(.48)}50%{transform:translateY(-8px) scale(.50)}}
  header{height:50px;padding:0 12px}
 .info{border-radius:18px}
 .info-name{font-size:28px}
 .nav{bottom:10px;position:absolute}
 .nav button{padding:16px 12px;font-size:13px;max-width:none}
</style>
</head>
<body>
<div class="bg"></div>
<header><div style="display:flex;gap:8px;align-items:center"><div id="logoIcon" style="width:34px;height:34px;border-radius:10px;background:rgba(20,35,50,.9);border:1px solid rgba(125,232,255,.2);display:flex;align-items:center;justify-content:center">🦋</div><div><div style="font-size:11px;letter-spacing:2px;font-weight:800">GENESIS LAB</div><div style="font-size:7px;opacity:.5;letter-spacing:1px">VOID VIPERS</div></div></div><div style="font-size:11px;opacity:.7"><span id="curNum">01</span>/04</div></header>

<div class="main"><div class="wrap">
<div class="model-shell">
<div style="padding:14px 16px;display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:9px;letter-spacing:2px;color:var(--cyan);font-weight:800">SPECIMEN</div><div style="font-size:26px;font-weight:900;font-style:italic;text-transform:uppercase" id="specName">Butterfly</div></div><div style="padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid rgba(125,232,255,.18);font-size:9px;color:var(--cyan)">0<span id="specNum">1</span>/04</div></div>
<div class="viewer-box">
<model-viewer id="modelViewer" src="./assests/butterfly.glb" camera-controls auto-rotate camera-orbit="0deg 75deg 5.5m" field-of-view="35deg" exposure="1.1" environment-image="neutral" autoplay touch-action="pan-y"></model-viewer>
<div class="nav"><button onclick="move(-1)">← PREV</button><button onclick="move(1)">NEXT →</button></div>
</div>
</div>

<div class="info">
<div style="font-size:8px;letter-spacing:3px;color:var(--cyan)">SPECIMEN PROFILE</div>
<div style="display:flex;justify-content:space-between;margin:6px 0 12px"><div class="info-name" id="infoName">Butterfly</div><div id="infoType" style="font-size:8px;padding:6px 9px;border-radius:999px;background:var(--cyan);color:#041018;font-weight:900;align-self:center">Lepidoptera</div></div>
<div class="row"><div style="opacity:.6">ID</div><div style="font-weight:700" id="specId">ID-0001</div></div>
<div class="row"><div style="opacity:.6">Name</div><div style="font-weight:700" id="commonName">Butterfly</div></div>
<div class="row"><div style="opacity:.6">Habitat</div><div style="font-weight:700" id="habitat">Meadows</div></div>
<div class="desc" id="desc"></div>
<div class="stats" id="stats"></div>
<div id="attrs"></div>
<div id="pills" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:12px"></div>
</div>
</div></div>

<script>
const data=[
{name:'Butterfly',type:'Lepidoptera',habitat:'Meadows, gardens, forests',desc:'Butterflies are winged pollinators whose vibrant patterns are used for signaling, camouflage, and species recognition.',stats:[['HABITAT','Meadows'],['LIFECYCLE','Metamorphosis'],['ROLE','Pollinator']],attr:[['Flight Agility',.88],['Coloration',.92],['Wing Strength',.72]],tags:['POLLINATION','FLIGHT','METAMORPHOSIS'],icon:'🦋'},
{name:'Honey Bee',type:'Apis Mellifera',habitat:'Flower meadows',desc:'Honey bees are fundamental pollinators supporting crop production. Highly organized social colony.',stats:[['HABITAT','Floral fields'],['LIFECYCLE','Social colony'],['ROLE','Pollinator']],attr:[['Pollination',.92],['Foraging',.78],['Colony',.85]],tags:['POLLINATOR','HIVE'],icon:'🐝'},
{name:'Rhino Beetle',type:'Dynastinae',habitat:'Tropical forests',desc:'Rhino beetles are armored insects known for their horn-like projections.',stats:[['HABITAT','Tropical forest'],['LIFECYCLE','Larval'],['ROLE','Decomposer']],attr:[['Horn Strength',.92],['Durability',.88],['Activity',.6]],tags:['ARMOR','STRENGTH'],icon:'🪲'},
{name:'Praying Mantis',type:'Mantodea',habitat:'Gardens & shrubs',desc:'Praying mantises are ambush predators recognized for their precise hunting.',stats:[['HABITAT','Shrubs'],['LIFECYCLE','Incomplete'],['ROLE','Predator']],attr:[['Strike',.9],['Camouflage',.89],['Vision',.86]],tags:['PREDATOR','VISION'],icon:'🦗'}
];
const models=['./assests/butterfly.glb','./assests/bee_converted.glb','./assests/a_rhino_beetle.glb','./assests/mantis_religiosa_-_ct_scan.glb'];
let cur=0; const mv=document.getElementById('modelViewer'); const urls=new Map();
async function preload(){for(const m of models){try{const r=await fetch(m);const b=await r.blob();urls.set(m,URL.createObjectURL(b))}catch{}}}
function render(){
  const d=data[cur];
  mv.src=urls.get(models[cur])||models[cur];
  document.getElementById('specName').textContent=d.name;
  document.getElementById('infoName').textContent=d.name;
  document.getElementById('infoType').textContent=d.type;
  document.getElementById('specNum').textContent=String(cur+1).padStart(2,'0');
  document.getElementById('curNum').textContent=String(cur+1).padStart(2,'0');
  document.getElementById('specId').textContent='ID-000'+(cur+1);
  document.getElementById('commonName').textContent=d.name;
  document.getElementById('habitat').textContent=d.habitat;
  document.getElementById('logoIcon').textContent=d.icon;
  document.getElementById('desc').textContent=d.desc;
  document.getElementById('stats').innerHTML=d.stats.map(s=>`<div class="stat"><div style="font-size:7px;opacity:.5">${s[0]}</div><div style="font-size:10px;font-weight:700">${s[1]}</div></div>`).join('');
  document.getElementById('attrs').innerHTML=d.attr.map(a=>`<div style="display:flex;gap:10px;margin:10px 0"><div style="font-size:10px;opacity:.6;width:110px">${a[0]}</div><div style="flex:1;height:5px;background:rgba(0,0,0,.5);border-radius:99px;overflow:hidden"><div style="height:100%;width:${a[1]*100}%;background:linear-gradient(90deg,var(--cyan),var(--lime))"></div></div></div>`).join('');
  document.getElementById('pills').innerHTML=d.tags.map(t=>`<span style="padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);font-size:8px">${t}</span>`).join('');
}
function move(d){cur=(cur+d+models.length)%models.length;render()}
let startX=0;document.addEventListener('touchstart',e=>startX=e.touches[0].clientX);document.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>50){move(dx<0?1:-1)}});
preload();render();
</script>
</body>
</html>
