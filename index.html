<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GENESIS LAB • Specimen Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.3.1/dist/model-viewer.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#04080f;overflow:hidden;height:100vh;font-family:'Space Mono',monospace;color:#dff3ff}

.bg{position:fixed;inset:0;z-index:-2;background:#04080f url('./sci_fi_archive_lab.webp') center/cover no-repeat}
.bg::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(2,5,10,.75) 100%)}
.grid-overlay{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.25;background-image:linear-gradient(rgba(125,232,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(125,232,255,.06) 1px,transparent 1px);background-size:42px 42px}

/* one slow horizontal scan sweeping the whole screen - the single orchestrated motion cue */
.scanline{position:fixed;left:0;right:0;height:120px;z-index:1;pointer-events:none;background:linear-gradient(to bottom,transparent,rgba(125,232,255,.06),transparent);animation:sweep 7s linear infinite}
@keyframes sweep{0%{top:-120px}100%{top:100vh}}

model-viewer#mv{position:fixed!important;left:50%!important;top:62%!important;width:min(66vw,720px)!important;height:min(66vh,560px)!important;transform:translate(-50%,-50%);z-index:5;pointer-events:auto;--progress-bar-height:0px;--progress-bar-color:transparent;transition:filter .25s,opacity .2s ease}
model-viewer#mv.xray{filter:grayscale(1) sepia(1) hue-rotate(165deg) saturate(4) brightness(1.15) contrast(1.25)}

.base-wrap{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:380px;height:180px;z-index:6;pointer-events:none;display:flex;justify-content:center;align-items:flex-end}
.platform{position:relative;width:340px;height:340px;transform:perspective(800px) rotateX(68deg);transform-origin:bottom center}
.platform-outer{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#1e2c47,#121c2e 50%,#080d16 85%);border:2px solid rgba(125,232,255,.9);box-shadow:0 0 25px rgba(125,232,255,.6)}
.platform-mid{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:76%;height:76%;border-radius:50%;background:#0a1018}
.portal{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48%;height:48%;border-radius:50%;background:radial-gradient(circle,#e8c0ff,#7b2cbf,#4a148c);box-shadow:0 0 35px rgba(157,78,221,1);animation:portalGlow 2.2s ease-in-out infinite}
.beam{position:absolute;bottom:50%;left:50%;transform:translateX(-50%);width:70px;height:60px;background:linear-gradient(to top,rgba(176,110,255,.8),transparent);clip-path:polygon(10% 100%,90% 100%,60% 0%,40% 0%)}

.light-pillar{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);width:140px;height:420px;background:linear-gradient(to top,rgba(200,120,255,.95),rgba(157,78,221,.5) 35%,rgba(125,232,255,.15) 65%,transparent 90%);filter:blur(10px);mix-blend-mode:screen;z-index:4;pointer-events:none;animation:pillarPulse 2.2s ease-in-out infinite}
@keyframes pillarPulse{0%,100%{opacity:.65;transform:translateX(-50%) scaleY(1)}50%{opacity:1;transform:translateX(-50%) scaleY(1.1)}}
@keyframes portalGlow{0%,100%{box-shadow:0 0 35px rgba(157,78,221,1)}50%{box-shadow:0 0 55px rgba(157,78,221,1),0 0 90px rgba(200,120,255,.7)}}

/* --- header / HUD chrome --- */
header{position:fixed;top:0;left:0;right:0;height:56px;padding:0 16px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(rgba(4,8,15,.85),rgba(4,8,15,.5));border-bottom:1px solid rgba(125,232,255,.18);z-index:10;backdrop-filter:blur(6px)}
.brand{display:flex;gap:10px;align-items:center}
.brand-icon{width:30px;height:30px;border-radius:7px;background:rgba(20,35,50,.9);border:1px solid rgba(125,232,255,.35);display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 0 12px rgba(125,232,255,.25)}
.brand-title{font-family:'Orbitron',sans-serif;font-weight:700;font-size:13px;letter-spacing:.06em;color:#eaf9ff;text-shadow:0 0 10px rgba(125,232,255,.5);animation:flicker 4s ease-in-out 1}
@keyframes flicker{0%{opacity:0}6%{opacity:1}8%{opacity:.3}10%{opacity:1}100%{opacity:1}}
.brand-sub{font-size:8px;letter-spacing:.08em;color:#7de8ff;opacity:.65;margin-top:1px}
#counter{margin-left:12px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.05em;border:1px solid rgba(125,232,255,.3);padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.4);color:#9fe8ff}
.live-btn{padding:6px 12px;border-radius:999px;background:rgba(255,42,42,.15);border:1px solid #ff2a2a;color:#ff8a8a;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.05em;cursor:pointer;display:flex;align-items:center;gap:5px}
.live-dot{width:6px;height:6px;border-radius:50%;background:#ff2a2a;box-shadow:0 0 6px #ff2a2a;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* --- bottom controls --- */
.bottom-bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:20;align-items:center}
.circle-btn{width:52px;height:52px;border-radius:50%;background:rgba(6,12,20,.8);border:1px solid rgba(125,232,255,.4);color:#7de8ff;font-size:20px;cursor:pointer;transition:box-shadow .08s,transform .08s}
.circle-btn:hover{box-shadow:0 0 14px rgba(125,232,255,.5);transform:translateY(-1px)}
.main-btn{padding:16px 32px;border-radius:999px;background:linear-gradient(90deg,#7de8ff,#3ac6ff);border:none;color:#04080f;font-family:'Orbitron',sans-serif;font-weight:700;font-size:13px;letter-spacing:.05em;cursor:pointer;box-shadow:0 0 18px rgba(125,232,255,.45);transition:box-shadow .08s,transform .08s}
.main-btn:hover{box-shadow:0 0 26px rgba(125,232,255,.7);transform:translateY(-1px)}

/* --- side feature toolbar --- */
.side-tools{position:fixed;right:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:20}
.tool-btn{position:relative;width:50px;height:50px;border-radius:12px;background:rgba(6,12,20,.8);border:1px solid rgba(125,232,255,.35);color:#7de8ff;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:box-shadow .08s,transform .08s,background .08s}
.tool-btn:hover{box-shadow:0 0 14px rgba(125,232,255,.55);transform:translateX(-2px)}
.tool-btn.active{background:rgba(125,232,255,.22);border-color:#7de8ff;box-shadow:0 0 14px rgba(125,232,255,.6)}
.tool-btn .tip{position:absolute;right:60px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.85);border:1px solid rgba(125,232,255,.3);color:#dff3ff;font-family:'Space Mono',monospace;font-size:9px;padding:4px 8px;border-radius:4px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .08s}
.tool-btn:hover .tip{opacity:1}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(10px);background:rgba(6,12,20,.92);border:1px solid rgba(125,232,255,.4);color:#9fe8ff;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.03em;padding:8px 16px;border-radius:999px;z-index:25;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* --- specimen data overlay --- */
#overlay{position:fixed;inset:0;z-index:30;background:rgba(4,8,15,.92);backdrop-filter:blur(20px);display:none;padding:16px;overflow-y:auto}
.info-card{position:relative;max-width:700px;margin:40px auto;background:rgba(12,22,38,.97);border:1px solid rgba(125,232,255,.22);border-radius:6px;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.5)}
.corner{position:absolute;width:16px;height:16px;border:2px solid #7de8ff;opacity:.8}
.corner.tl{top:8px;left:8px;border-right:none;border-bottom:none}
.corner.tr{top:8px;right:8px;border-left:none;border-bottom:none}
.corner.bl{bottom:8px;left:8px;border-right:none;border-top:none}
.corner.br{bottom:8px;right:8px;border-left:none;border-top:none}
.info-header{padding:20px 22px 16px;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid rgba(125,232,255,.15)}
#pName{font-family:'Orbitron',sans-serif;font-weight:700;font-size:18px;letter-spacing:.03em;color:#f2fbff}
#pSci{font-size:10px;opacity:.6;font-style:italic;margin-top:3px}
.close-btn{width:32px;height:32px;border-radius:50%;background:rgba(255,42,42,.15);border:1px solid rgba(255,42,42,.4);color:#ff5a5a;cursor:pointer;flex-shrink:0;transition:box-shadow .08s,background .08s,transform .08s}
.close-btn:hover{background:rgba(255,42,42,.3);box-shadow:0 0 16px rgba(255,42,42,.7);transform:scale(1.08)}
.info-body{padding:20px 22px;display:grid;gap:14px}
.info-tag{padding:4px 10px;border-radius:5px;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.03em;border:1px solid rgba(125,232,255,.3);background:rgba(125,232,255,.08);color:#7de8ff;margin-right:6px;display:inline-block;transition:box-shadow .08s,background .08s,transform .08s}
.info-tag:hover{background:rgba(125,232,255,.2);box-shadow:0 0 12px rgba(125,232,255,.55);transform:translateY(-1px)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info-stat{background:rgba(0,0,0,.35);border:1px solid rgba(125,232,255,.12);border-left:2px solid rgba(125,232,255,.5);border-radius:4px;padding:10px 12px;transition:box-shadow .08s,border-color .08s,transform .08s}
.info-stat:hover{border-color:rgba(125,232,255,.7);box-shadow:0 0 18px rgba(125,232,255,.4);transform:translateY(-2px)}
.info-stat b{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.05em;color:#7de8ff;display:block;margin-bottom:3px;opacity:.8}
.info-stat span{font-size:12px;font-weight:700;color:#eaf9ff}
.info-desc{font-size:12px;line-height:1.65;opacity:.85;background:rgba(0,0,0,.22);padding:14px;border-radius:4px;border-left:2px solid rgba(157,78,221,.5);transition:box-shadow .08s}
.info-desc:hover{box-shadow:0 0 18px rgba(157,78,221,.35);opacity:1}
.fact-box{background:rgba(157,78,221,.08);border:1px solid rgba(157,78,221,.3);border-radius:4px;padding:12px 14px;transition:box-shadow .08s,border-color .08s}
.fact-box:hover{border-color:rgba(157,78,221,.6);box-shadow:0 0 22px rgba(157,78,221,.5)}
.fact-label{font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.05em;color:#c9a3ff;margin-bottom:6px}
#pFact{font-size:12px;line-height:1.55;font-weight:700;color:#f0e6ff}
</style>
</head>
<body>
<div class="bg"></div>
<div class="grid-overlay"></div>
<div class="scanline"></div>

<model-viewer id="mv"
src="./assests/butterfly.glb"
camera-controls auto-rotate
camera-orbit="0deg 75deg auto"
field-of-view="auto"
exposure="1.1"
shadow-intensity="1"
environment-image="https://modelviewer.dev/shared-assets/environments/spruit_sunrise_1k_HDR.hdr"
autoplay
></model-viewer>

<div class="light-pillar"></div>
<div class="base-wrap"><div class="platform"><div class="beam"></div><div class="platform-outer"></div><div class="platform-mid"></div><div class="portal"></div></div></div>

<header>
  <div class="brand">
    <div class="brand-icon">🦋</div>
    <div>
      <div class="brand-title">GENESIS LAB</div>
      <div class="brand-sub">specimen archive</div>
    </div>
    <div id="counter">01 / 04</div>
  </div>
  <button class="live-btn" onclick="mv.autoRotate=!mv.autoRotate"><span class="live-dot"></span>LIVE SCAN</button>
</header>

<div class="bottom-bar">
  <button class="circle-btn" onclick="move(-1)">‹</button>
  <button class="main-btn" onclick="openInfo()">VIEW DATA</button>
  <button class="circle-btn" onclick="move(1)">›</button>
</div>

<div class="side-tools">
  <button class="tool-btn" onclick="zoomStep(0.85)"><span class="tip">Zoom in</span>+</button>
  <button class="tool-btn" onclick="zoomStep(1.18)"><span class="tip">Zoom out</span>–</button>
  <button class="tool-btn" onclick="frameModel()"><span class="tip">Reset view</span>⟲</button>
  <button class="tool-btn" id="xrayBtn" onclick="toggleXray()"><span class="tip">X-ray scan mode</span>◐</button>
  <button class="tool-btn" onclick="toggleFullscreen()"><span class="tip">Fullscreen</span>⛶</button>
  <button class="tool-btn" onclick="captureShot()"><span class="tip">Capture snapshot</span>📷</button>
  <button class="tool-btn" id="tourBtn" onclick="toggleTour()"><span class="tip">Auto tour (hands-free)</span>🔁</button>
  <button class="tool-btn" id="soundBtn" onclick="toggleSound()"><span class="tip">Ambient lab sound</span>🔊</button>
</div>

<div class="toast" id="toast">SNAPSHOT SAVED</div>

<div id="overlay" onclick="if(event.target===this) closeInfo()">
  <div class="info-card">
    <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
    <div class="info-header">
      <div><div id="pName">BUTTERFLY</div><div id="pSci">Danaus</div></div>
      <button class="close-btn" onclick="closeInfo()">✕</button>
    </div>
    <div class="info-body">
      <div><span class="info-tag" id="pTag1">TAG</span><span class="info-tag" id="pTag2">TAG</span><span class="info-tag" id="pTag3">TAG</span></div>
      <div class="info-grid">
        <div class="info-stat"><b>SIZE</b><span id="pStat1">-</span></div>
        <div class="info-stat"><b>LIFESPAN</b><span id="pStat2">-</span></div>
        <div class="info-stat"><b>HABITAT</b><span id="pStat3">-</span></div>
        <div class="info-stat"><b>DIET</b><span id="pStat4">-</span></div>
        <div class="info-stat"><b>ORDER</b><span id="pStat5">-</span></div>
        <div class="info-stat"><b>TOP SPEED</b><span id="pStat6">-</span></div>
        <div class="info-stat"><b>PREDATORS</b><span id="pStat7">-</span></div>
        <div class="info-stat"><b>CONSERVATION</b><span id="pStat8">-</span></div>
      </div>
      <div class="info-desc" id="pDesc"></div>
      <div class="fact-box"><div class="fact-label">FIELD NOTE</div><div id="pFact"></div></div>
    </div>
  </div>
</div>

<script>
const models=['./assests/butterfly.glb','./assests/bee_converted.glb','./assests/a_rhino_beetle.glb','./assests/mantis_religiosa_-_ct_scan.glb'];

const infoData=[
{name:"MONARCH BUTTERFLY",sci:"Danaus plexippus",tags:["LEPIDOPTERA","MIGRATORY","POLLINATOR"],wingspan:"8.9-10.2 cm",lifespan:"2-6 weeks",habitat:"North America",diet:"Milkweed",order:"Lepidoptera",speed:"~19 km/h",predators:"Birds, wasps, mice",status:"Threatened (migratory)",desc:"4800km migration Canada to Mexico. 100,000 scales on wings.",fact:"Delhi to London distance!"},
{name:"HONEY BEE",sci:"Apis mellifera",tags:["HYMENOPTERA","EUSOCIAL","POLLINATOR"],wingspan:"2.5 cm",lifespan:"6 weeks",habitat:"Worldwide",diet:"Nectar",order:"Hymenoptera",speed:"~24 km/h",predators:"Birds, spiders, wasps",status:"Near Threatened",desc:"75% fruits pollination. 60k bees/hive, 300M flowers/day.",fact:"1/12 teaspoon honey lifetime!"},
{name:"RHINO BEETLE",sci:"Oryctes rhinoceros",tags:["COLEOPTERA","STRONGEST","NOCTURNAL"],wingspan:"6-12 cm",lifespan:"2-3 years",habitat:"Tropical",diet:"Wood",order:"Coleoptera",speed:"~3 km/h (walk)",predators:"Birds, raccoons, larger mammals",status:"Least Concern",desc:"Strongest insect - 850x weight! 65 ton truck if human.",fact:"Sumo wrestling with horn!"},
{name:"PRAYING MANTIS",sci:"Mantis religiosa",tags:["MANTODEA","PREDATOR","360° VISION"],wingspan:"5-15 cm",lifespan:"10-12 months",habitat:"Tropical",diet:"Insects",order:"Mantodea",speed:"50ms strike",predators:"Birds, spiders, frogs",status:"Least Concern",desc:"Head 180° rotates! 5 eyes, 50ms strike - faster than blink!",fact:"Only insect with 3D vision! NASA robots!"}
];

let cur=0; const mv=document.getElementById('mv');

const preloaded = new Array(models.length).fill(null);
function preloadModels(){
  models.forEach((url,i)=>{
    fetch(url).then(r=>r.blob()).then(b=>{ preloaded[i]=URL.createObjectURL(b); }).catch(()=>{});
  });
}

function frameModel(){
  mv.cameraOrbit = '0deg 75deg auto';
  mv.fieldOfView = 'auto';
  mv.jumpCameraToGoal();
}

function render(){
  mv.style.opacity = 0.15;
  mv.src=preloaded[cur] || models[cur];
  const d=infoData[cur];
  document.getElementById('counter').textContent=`0${cur+1} / 04`;
  document.getElementById('pName').textContent=d.name; document.getElementById('pSci').textContent=d.sci;
  document.getElementById('pTag1').textContent=d.tags[0]; document.getElementById('pTag2').textContent=d.tags[1]; document.getElementById('pTag3').textContent=d.tags[2];
  document.getElementById('pStat1').textContent=d.wingspan; document.getElementById('pStat2').textContent=d.lifespan;
  document.getElementById('pStat3').textContent=d.habitat; document.getElementById('pStat4').textContent=d.diet;
  document.getElementById('pStat5').textContent=d.order; document.getElementById('pStat6').textContent=d.speed;
  document.getElementById('pStat7').textContent=d.predators; document.getElementById('pStat8').textContent=d.status;
  document.getElementById('pDesc').textContent=d.desc; document.getElementById('pFact').textContent=d.fact;
}

mv.addEventListener('load', ()=>{
  frameModel();
  mv.style.opacity = 1;
  if(tourActive){
    clearTimeout(tourTimeout);
    tourTimeout = setTimeout(()=>{ if(tourActive) move(1); }, 4000);
  }
});

function zoomStep(factor){
  const o = mv.getCameraOrbit();
  mv.cameraOrbit = `${o.theta}rad ${o.phi}rad ${o.radius*factor}m`;
}

function toggleXray(){
  mv.classList.toggle('xray');
  document.getElementById('xrayBtn').classList.toggle('active');
}

function toggleFullscreen(){
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen(); }
  else{ document.exitFullscreen(); }
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

function captureShot(){
  mv.toBlob({idealAspect:true}).then(blob=>{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${infoData[cur].name.replace(/\s+/g,'_').toLowerCase()}_scan.png`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('SNAPSHOT SAVED');
  }).catch(()=>showToast('CAPTURE FAILED'));
}

let tourActive = false, tourTimeout = null;
function toggleTour(){
  const btn = document.getElementById('tourBtn');
  tourActive = !tourActive;
  btn.classList.toggle('active', tourActive);
  if(tourActive){
    showToast('AUTO TOUR STARTED');
    tourTimeout = setTimeout(()=>{ if(tourActive) move(1); }, 4000);
  } else {
    showToast('AUTO TOUR STOPPED');
    clearTimeout(tourTimeout);
  }
}

/* ---- FIXED: Ambient lab hum (synthesized in-browser, no audio file needed) ----
   Previously the gain was set on the AudioContext before it had actually
   resumed (browsers start contexts suspended until a user gesture confirms
   it), and the volume/frequencies chosen were too quiet to notice even when
   running. This version awaits the resume, uses a louder gain, and passes
   the tones through a lowpass filter for a warmer, audible hum with a
   smooth fade in/out instead of an abrupt on/off. */
let audioCtx = null, soundOn = false, gainNode = null;

async function toggleSound(){
  const btn = document.getElementById('soundBtn');
  if(!audioCtx){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const osc1 = audioCtx.createOscillator(); osc1.type='sine'; osc1.frequency.value=90;
    const osc2 = audioCtx.createOscillator(); osc2.type='sine'; osc2.frequency.value=135;
    const filter = audioCtx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=500;
    gainNode = audioCtx.createGain(); gainNode.gain.value = 0;
    const lfo = audioCtx.createOscillator(); lfo.frequency.value=0.15;
    const lfoGain = audioCtx.createGain(); lfoGain.gain.value=0.03;
    lfo.connect(lfoGain); lfoGain.connect(gainNode.gain);
    osc1.connect(filter); osc2.connect(filter);
    filter.connect(gainNode); gainNode.connect(audioCtx.destination);
    osc1.start(); osc2.start(); lfo.start();
  }
  if(audioCtx.state === 'suspended') await audioCtx.resume();
  soundOn = !soundOn;
  gainNode.gain.cancelScheduledValues(audioCtx.currentTime);
  gainNode.gain.linearRampToValueAtTime(soundOn ? 0.18 : 0, audioCtx.currentTime + 0.4);
  btn.classList.toggle('active', soundOn);
}

document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight') move(1);
  else if(e.key==='ArrowLeft') move(-1);
  else if(e.code==='Space'){ e.preventDefault(); mv.autoRotate=!mv.autoRotate; }
});

window.move=function(d){cur=(cur+d+models.length)%models.length;render()}
window.openInfo=function(){document.getElementById('overlay').style.display='block'}
window.closeInfo=function(){document.getElementById('overlay').style.display='none'}
render();
preloadModels();
</script>
</body>
</html>
